apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-eastwest
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-name: mall-apne2-az-a
        values:
          network: az-a
          # HAND-COPIED from `terraform output istio_eastwest_security_group_id`
          # (terraform/environments/production/ap-northeast-2/shared) — there is
          # NO automated terraform→manifest injection (PR#32 review, 3/3 models):
          # this appset is merely the SINGLE place the literal lives (same value
          # for both AZs, one shared SG; eastwest-gateway.yaml carries no copy).
          # If the SG is ever recreated (create_before_destroy) or this is
          # deployed into a new account, this value MUST be re-pasted or the
          # east-west NLB silently references a nonexistent SG — a blackhole
          # that only shows up when failover is needed. Automated injection
          # (output → ConfigMap → appset) is the tracked follow-up.
          eastwestSecurityGroupId: sg-0355c4a665545ff7d
    - clusters:
        selector:
          matchLabels:
            cluster-name: mall-apne2-az-c
        values:
          network: az-c
          eastwestSecurityGroupId: sg-0355c4a665545ff7d
  template:
    metadata:
      name: 'istio-eastwest-{{name}}'
    spec:
      project: default
      source:
        # HTTPS, not SSH: ArgoCD in this account only has HTTPS credentials
        # registered (see docs/portability-assessment.md) — SSH-form appsets
        # never sync.
        repoURL: https://github.com/Atom-oh/multi-region-architecture
        targetRevision: main
        path: k8s/infra/istio-eastwest
        kustomize:
          patches:
            - target:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: istio-eastwestgateway
              patch: |-
                - op: replace
                  path: /metadata/labels/topology.istio.io~1network
                  value: '{{values.network}}'
                - op: replace
                  path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-security-groups
                  value: '{{values.eastwestSecurityGroupId}}'
      destination:
        server: '{{server}}'
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # gateway-api CRDs exceed the 262KB annotation limit
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
