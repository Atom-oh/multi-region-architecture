apiVersion: v1
kind: ServiceAccount
metadata:
  name: mall-restore
  namespace: core-services
  annotations:
    # Separate role per direction: backup holds READ-only on the static-assets
    # bucket (a CloudFront origin), restore holds the write. See shared/main.tf.
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/mall-apne2-restore
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mall-restore
  namespace: core-services
  labels:
    app: backup-restore
    component: data-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: backup-restore
    spec:
      restartPolicy: Never
      serviceAccountName: mall-restore
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: restore
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/shopping-mall/backup-restore:latest
          command: ["bash", "restore.sh"]
          env:
            # Fill in before applying: the archive to restore from
            # (backups live in the private production-mall-backups-<region> bucket).
            - name: ARCHIVE_S3_URI
              value: "s3://production-mall-backups-ap-northeast-2-<AWS_ACCOUNT_ID>/backups/mall-data-backup-<region>-<timestamp>.tar.gz"
            - name: AWS_REGION
              value: "ap-northeast-2"
            # Literal, not configMapKeyRef: kustomize's configMapGenerator
            # hash-suffixes "region-config"'s real name, so a fixed name here
            # would never resolve — this Job isn't part of that same build.
            # Update these when restoring into a different environment.
            - name: AURORA_ENDPOINT
              value: "production-aurora-global-ap-northeast-2.cluster-ch0io48c0dqx.ap-northeast-2.rds.amazonaws.com"
            - name: AURORA_USER
              value: "mall_admin"
            - name: AURORA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-secrets # ExternalSecret <- mall/core/aurora
                  key: DB_PASSWORD
            # MUST be a WRITABLE cluster endpoint. The ap-northeast-2 DocumentDB
            # (production-docdb-global-ap-northeast-2.cluster-....ap-northeast-2.
            # docdb.amazonaws.com) is a READ-ONLY global-cluster secondary — see
            # docs/portability-assessment.md — so restore.sh's
            # assert_docdb_writable ABORTS on it by design. Point this at the
            # us-east-1 primary cluster endpoint, or at the Korea cluster only
            # AFTER promoting it (aws docdb remove-from-global-cluster).
            - name: DOCUMENTDB_HOST
              value: "<WRITABLE_DOCUMENTDB_CLUSTER_ENDPOINT>"
            - name: DOCUMENTDB_USER
              valueFrom:
                secretKeyRef:
                  name: product-catalog-secrets
                  key: DB_USER
            - name: DOCUMENTDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-catalog-secrets
                  key: DB_PASSWORD
            - name: STATIC_ASSETS_BUCKET
              value: "<TARGET_STATIC_ASSETS_BUCKET>"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
